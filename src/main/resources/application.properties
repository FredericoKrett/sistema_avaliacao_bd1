spring.application.name=sistema-avaliacoes
server.port=8080

# Configuracao do banco PostgreSQL (pode ser sobrescrita por variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/avaliacoes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
